name: Deploy Skills Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One concurrent deploy; a queued run supersedes an older queued one but never
# cancels a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The catalogue is the point of this site. If it is malformed or a demo
      # claims a source that does not exist, fail here rather than publishing a
      # page that overstates what we have.
      - name: Verify source catalogue
        run: npm run verify

      - name: Build
        run: npm run build
        env:
          # Project sites are served from /<repo>/. Derive it so a fork with a
          # different repository name still gets correct asset URLs.
          SKILLS_LAB_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
